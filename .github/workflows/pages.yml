name: Deploy Susomoon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore verified public application
        run: |
          cat site.zip.001 site.zip.002 site.zip.003 site.zip.004 > site.zip
          sha256sum -c site.sha256
          mkdir _site
          unzip -q site.zip -d _site
          test -f _site/index.html
          test ! -e _site/conversation.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
